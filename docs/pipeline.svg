  <text x="70" y="415" fill="#9a94b8" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" font-weight="400">Uploader-written captions are preferred over automatic ones, and the original track over any YouTube machine translation.</text>
