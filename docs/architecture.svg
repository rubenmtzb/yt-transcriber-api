  <text x="94" y="344" fill="#b14aed" font-size="12" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-weight="400" letter-spacing="2">WHY IT RUNS AT HOME</text>
  <text x="94" y="372" fill="#9a94b8" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" font-weight="400">YouTube answers datacenter address ranges with a bot check that yt-dlp cannot get past on any retry. A residential</text>
  <text x="94" y="390" fill="#9a94b8" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" font-weight="400">connection never sees it. Where the API runs decides whether it works at all — that is a requirement, not a preference.</text>
