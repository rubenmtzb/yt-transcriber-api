spring:
  application:
    name: yt-transcriber-api

server:
  # Render (and most container hosts) assign the port at runtime and expect the process to bind to
  # whatever they put in PORT; the default keeps a plain local run on 8080 as before.
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # Anything beyond health is unauthenticated reconnaissance once this is public: metrics and
        # prometheus hand out heap, GC, disk, per-endpoint latencies and request counts to anyone
        # who asks. Override locally (or bind management to its own unpublished port) when the
        # numbers are actually wanted.
        include: ${ACTUATOR_ENDPOINTS:health}
  endpoint:
    health:
      show-details: never

app:
  processing:
    max-video-duration-seconds: ${MAX_VIDEO_DURATION_SECONDS:1200}
    max-requests-per-hour: ${MAX_REQUESTS_PER_HOUR:3}
    max-audio-minutes-per-hour: ${MAX_AUDIO_MINUTES_PER_HOUR:60}
    max-concurrent-transcriptions: ${MAX_CONCURRENT_TRANSCRIPTIONS:2}
    # Looser than the per-session numbers on purpose: an address is shared by everyone behind one
    # router, so this must not lock out a household or an office, while still being the ceiling a
    # single abuser cannot step over by inventing new session ids.
    max-requests-per-hour-per-ip: ${MAX_REQUESTS_PER_HOUR_PER_IP:12}
    max-audio-minutes-per-hour-per-ip: ${MAX_AUDIO_MINUTES_PER_HOUR_PER_IP:240}
  ytdlp:
    binary-path: ${YTDLP_BINARY_PATH:yt-dlp}
    timeout-seconds: ${YTDLP_TIMEOUT_SECONDS:120}
  whisper:
    binary-path: ${WHISPER_BINARY_PATH:whisper-cli}
    model-path: ${WHISPER_MODEL_PATH:}
    timeout-seconds: ${WHISPER_TIMEOUT_SECONDS:900}
    min-audio-duration-seconds: ${WHISPER_MIN_AUDIO_DURATION_SECONDS:15}
  deepl:
    api-key: ${TRANSLATION_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}
